basePath: /
definitions:
  apperr.Code:
    enum:
    - NOT_FOUND
    - INVALID_ARGUMENT
    - VALIDATION_FAILED
    - CONFLICT
    - REQUEST_TOO_LARGE
    - INTERNAL
    type: string
    x-enum-varnames:
    - CodeNotFound
    - CodeInvalidArgument
    - CodeValidation
    - CodeConflict
    - CodeTooLarge
    - CodeInternal
  apperr.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  httpx.Pagination:
    properties:
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  httpx.ProblemDetails:
    properties:
      code:
        $ref: '#/definitions/apperr.Code'
      errors:
        items:
          $ref: '#/definitions/apperr.FieldError'
        type: array
      message:
        type: string
      status:
        type: integer
    type: object
  template.CreateRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - email
    - name
    type: object
  template.PagedResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/template.Response'
        type: array
      pagination:
        $ref: '#/definitions/httpx.Pagination'
    type: object
  template.Response:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A basic template management API
  title: Template API
  version: "1.0"
paths:
  /templates:
    get:
      description: Returns a paged list of templates
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size, capped at 100
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/template.PagedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Get paged templates
      tags:
      - Templates
    post:
      consumes:
      - application/json
      description: Creates a new template
      parameters:
      - description: Template
        in: body
        name: template
        required: true
        schema:
          $ref: '#/definitions/template.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/template.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Create template
      tags:
      - Templates
  /templates/{id}:
    delete:
      description: Deletes a single template by ID
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Delete template by ID
      tags:
      - Templates
    get:
      description: Returns a single template by ID
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/template.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Get template by ID
      tags:
      - Templates
swagger: "2.0"
tags:
- description: Operations for managing templates
  name: Templates
